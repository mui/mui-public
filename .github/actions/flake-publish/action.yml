name: Flake publish

description: >
  Publish a sandboxed agent's output: vet its proposed patch, apply it to a
  fresh checkout, open a draft PR, and upsert a rolling tracking issue. This is
  the trust boundary — it treats nothing from the agent as safe except a patch
  it re-checks, and it is the only place the write token is used.

inputs:
  artifact-dir:
    description: Directory holding the downloaded agent output (report.md, pr-*.txt, fix.patch, summary.txt).
    required: true
  repo-dir:
    description: Fresh checkout of the target repo to apply the patch to and push from.
    required: true
  report-only:
    description: When "true", never open a PR — only update the tracking issue.
    required: false
    default: 'false'
  pr-label:
    required: false
    default: ci-flake-fix
  issue-label:
    required: false
    default: ci-flake-watch
  github-token:
    description: Token with contents/pull-requests/issues write.
    required: true

runs:
  using: composite
  steps:
    - name: Inspect and apply the patch
      id: patch
      if: ${{ inputs.report-only != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        patch="${{ inputs.artifact-dir }}/fix.patch"
        if [ ! -s "$patch" ] || [ ! -s "${{ inputs.artifact-dir }}/pr-body.md" ]; then
          echo "no fix proposed"
          echo "applied=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The patch is from an unrestricted agent; this step holds the write token. Vet, dry-run,
        # then apply — never run anything from the patch.
        node "$GITHUB_ACTION_PATH/inspect-patch.mjs" "$patch" "${{ inputs.repo-dir }}"
        git -C "${{ inputs.repo-dir }}" apply --check "$patch"
        git -C "${{ inputs.repo-dir }}" apply "$patch"
        echo "applied=true" >> "$GITHUB_OUTPUT"

    - name: Open the draft PR
      id: pr
      if: ${{ steps.patch.outputs.applied == 'true' }}
      shell: bash
      working-directory: ${{ inputs.repo-dir }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_DIR: ${{ github.workspace }}/${{ inputs.artifact-dir }}
      run: |
        set -euo pipefail
        gh label create "${{ inputs.pr-label }}" --force >/dev/null 2>&1 || true
        branch="${{ inputs.pr-label }}/$(date -u +%Y%m%d-%H%M%S)"
        git switch -c "$branch"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -qF "$ARTIFACT_DIR/pr-title.txt"
        git push -u origin "$branch"
        {
          cat "$ARTIFACT_DIR/pr-body.md"
          printf '\n\n---\n_Opened by a sandboxed agent. Unverified beyond any local check noted above; CI on this PR is the real test._\n'
        } > "$RUNNER_TEMP/pr-body.md"
        url=$(gh pr create --draft --label "${{ inputs.pr-label }}" \
          --title "$(head -n1 "$ARTIFACT_DIR/pr-title.txt")" --body-file "$RUNNER_TEMP/pr-body.md")
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Upsert the tracking issue
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ inputs.repo-dir }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_DIR: ${{ github.workspace }}/${{ inputs.artifact-dir }}
        PR_URL: ${{ steps.pr.outputs.url }}
      run: |
        set -euo pipefail
        gh label create "${{ inputs.issue-label }}" --force >/dev/null 2>&1 || true
        body_src="$ARTIFACT_DIR/report.md"
        [ -s "$body_src" ] || body_src="$ARTIFACT_DIR/summary.txt"
        body="$(cat "$body_src" 2>/dev/null || echo 'No CircleCI data this week.')"
        if [ -n "${PR_URL:-}" ]; then
          body="${body}"$'\n\n'"· suggested fix: ${PR_URL}"
        fi
        issue=$(gh issue list --label "${{ inputs.issue-label }}" --state open --json number --jq '.[0].number // empty')
        if [ -n "$issue" ]; then
          gh issue comment "$issue" --body "$body"
        else
          gh issue create --label "${{ inputs.issue-label }}" --title "CI flakiness watch" --body "$body"
        fi
