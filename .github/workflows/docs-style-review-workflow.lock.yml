name: "Review the style of a pull request's docs"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      exclude:
        default: "**/CHANGELOG*.md\n"
        description: Globs (one per line) of files to leave out, such as changelogs and generated files.
        type: string
      include:
        default: "**/*.md\n**/*.mdx\n"
        description: Globs (one per line) of the Markdown files to review.
        type: string
      max_comments:
        default: 15
        description: Most inline suggestions in one review.
        type: number
    secrets:
      CODE_INFRA_AUDITOR_CLIENT_ID:
        required: false
      CODE_INFRA_AUDITOR_PRIVATE_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  cancel-in-progress: true
  group: docs-style-review-${{ github.repository }}-${{ github.event.pull_request.number }}

run-name: "Review the style of a pull request's docs"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_SERVICE_NAME: gh-aw.docs-style-review-workflow
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Review%20the%20style%20of%20a%20pull%20request%27s%20docs,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=claude'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_LOGS_ENABLED: ${{ vars.GH_AW_OTLP_LOGS_ENABLED }}
  GH_AW_OTLP_LOGS_MAX_BYTES: ${{ vars.GH_AW_OTLP_LOGS_MAX_BYTES }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

