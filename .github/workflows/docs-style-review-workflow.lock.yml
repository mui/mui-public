          GH_AW_EXPR_77C1A4D2: ${{ github.event.comment.id || fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').comment_id }}
          GH_AW_EXPR_7C248226: ${{ github.event.issue.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'issue' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_C19C384F: ${{ github.event.discussion.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'discussion' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_INPUTS_MAX_COMMENTS: ${{ inputs.max_comments }}
          GH_AW_MCP_CLI_SERVERS_LIST: "- `safeoutputs` — run `safeoutputs --help` to see available tools"
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: ${{ needs.pre_activation.outputs.activated }}
          GH_AW_NEEDS_SCOPE_OUTPUTS_BUDGET: ${{ needs.scope.outputs.budget }}
          GH_AW_NEEDS_SCOPE_OUTPUTS_FILES: ${{ needs.scope.outputs.files }}
          GH_AW_NEEDS_SCOPE_OUTPUTS_LINES: ${{ needs.scope.outputs.lines }}
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Validate prompt placeholders
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
        env:
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Print prompt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
        env:
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Inventory installed skills
        if: success() || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKILL_DIR: ".claude/skills"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'skill_inventory.cjs'));
            await main();
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/aw-prompts/prompt-literal-values.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.claude/agents
            /tmp/gh-aw/.claude/skills
            /tmp/gh-aw/skill_inventory.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1' }}

  agent:
    name: agent
    needs:
      - activation
      - scope
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    # Permissions for the agent job (workflow permissions default to none).
    permissions:
      contents: read
      # Mints the GitHub OIDC token exchanged for a Claude token (engine.auth below).
      id-token: write
      # The agent's default GitHub toolset.
      issues: read
      pull-requests: read # Read pull requests and review comments for workflow context.
    cache-mode: read
    concurrency:
      group: "gh-aw-claude-docs-style-review-workflow"
      queue: max
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
      GH_AW_OBJECT_PACK_MAX_BYTES: ${{ vars.GH_AW_OBJECT_PACK_MAX_BYTES }}
      GH_AW_OBJECT_PACK_MAX_OBJECTS: ${{ vars.GH_AW_OBJECT_PACK_MAX_OBJECTS }}
      GH_AW_OBJECT_PACK_TIMEOUT_MS: ${{ vars.GH_AW_OBJECT_PACK_TIMEOUT_MS }}
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_TARGET_REPO_SLUG: ""
      GH_AW_WORKFLOW_ID_SANITIZED: docsstylereviewworkflow
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      artifact_prefix: ${{ needs.activation.outputs.artifact_prefix }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_endpoint_mismatch_error: ${{ steps.detect-agent-errors.outputs.model_endpoint_mismatch_error || 'false' }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@53d0749e19424a918acd82b4d140264ce48f2f14 # v1.2.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Review the style of a pull request's docs"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/docs-style-review-workflow.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.317"
          GH_AW_INFO_AWF_VERSION: "v0.29.11"
          GH_AW_INFO_ENGINE_ID: "claude"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Checkout repository (gh-aw default)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}activation
          path: /tmp/gh-aw
      - env:
          BUDGET: ${{ needs.scope.outputs.budget }}
          FILES: ${{ needs.scope.outputs.files }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LINES: ${{ needs.scope.outputs.lines }}
          NUMBER: ${{ github.event.pull_request.number }}
        name: Collect the changes
        run: "set -euo pipefail\nout=/tmp/gh-aw/agent/review\nmkdir -p \"$out/files\"\njq -n --argjson number \"$NUMBER\" --arg sha \"$HEAD_SHA\" --argjson budget \"$BUDGET\" \\\n  --argjson files \"$FILES\" --argjson lines \"$LINES\" \\\n  '{number: $number, head_sha: $sha, budget: $budget, files: $files, lines: $lines}' \\\n  > \"$out/scope.json\"\njq -r '.[]' <<< \"$FILES\" | while IFS= read -r path; do\n  mkdir -p \"$out/files/$(dirname \"$path\")\"\n  gh api \"repos/$HEAD_REPO/contents/$path?ref=$HEAD_SHA\" -H 'Accept: application/vnd.github.raw' \\\n    > \"$out/files/$path\"\ndone\ngh api --paginate \"repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files\" --jq '.[] | {path: .filename, patch}' \\\n  | jq -s --argjson files \"$FILES\" 'map(select(.path as $path | $files | index($path)))' \\\n  > \"$out/patches.json\"\ngh api --paginate \"repos/$GITHUB_REPOSITORY/pulls/$NUMBER/comments\" \\\n    --jq '.[] | select(.user.login == \"code-infra-auditor[bot]\") | {path, line, body}' \\\n  | jq -s . > \"$out/earlier-comments.json\"\nfind \"$out\" -type f | sed \"s#^$out/##\" | sort"

      - name: Configure Git credentials
        env:
          GH_AW_GIT_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install AWF binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.29.11 --rootless
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.317
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: '3'
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".claude/agents"
          GH_AW_SUB_AGENT_EXT: ".md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".claude/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.29.11@sha256:8774a73c351395b41d2ad0af4ddb4689007c67de3cd08bd9f43bb8a0e300690e ghcr.io/github/gh-aw-firewall/api-proxy:0.29.11@sha256:88d2d0e315a504d93fd4fb8847fd0f6b7f4469f41a6fc6047b3dc9654c56ab2c ghcr.io/github/gh-aw-firewall/cli-proxy:0.29.11@sha256:97782bc0d8ff7f80f19ae2fdc5e1668517aa732a6fa077e64b8d3919238496d2 ghcr.io/github/gh-aw-firewall/squid:0.29.11@sha256:861739ecf924dd2db5e5fb652db2ad82aaafd1615623297ddabc8f41a36b2847 ghcr.io/github/gh-aw-mcpg:v0.5.6@sha256:342cd624e1f179d91be2de7a146fc4f387092e62e6c8a47506d7932e113d2311 ghcr.io/github/gh-aw-node@sha256:8735428c2d4e602f90781ba0c571c400e8ff93c7ee1508a75d71f87e34e415cc ghcr.io/github/github-mcp-server:v2.1.0@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_FILE_ROOT: "${{ runner.temp }}/gh-aw"
          GH_AW_FILE_CONFIG: "{\"files\":[{\"path\":\"safeoutputs/config.json\",\"content_env\":\"GH_AW_SAFE_OUTPUTS_CONFIG\"}]}"
          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"create_pull_request_review_comment\":{\"max\":\"${GH_AW_INPUT_MAX_COMMENTS}\",\"side\":\"RIGHT\"},\"create_report_incomplete_issue\":{},\"noop\":{\"max\":2,\"report-as-issue\":\"false\"},\"report_incomplete\":{},\"report_missing_data\":{},\"report_missing_tool\":{},\"submit_pull_request_review\":{\"allowed_events\":[\"COMMENT\"],\"max\":1}}"
          GH_AW_INPUT_MAX_COMMENTS: ${{ inputs.max_comments }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'create_files.cjs'));
            await main();
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {
                "create_pull_request_review_comment": " CONSTRAINTS: Comments will be on the RIGHT side of the diff.",
                "submit_pull_request_review": " CONSTRAINTS: Maximum 1 review(s) can be submitted."
              },
              "repo_params": {},
              "dynamic_tools": [],
              "property_injections": {
                "submit_pull_request_review": {
                  "event": {
                    "description": "Review decision. Restricted by allowed-events configuration to: COMMENT.",
                    "enum": [
                      "COMMENT"
                    ],
                    "type": "string",
                    "x-synonyms": [
                      "action"
                    ]
                  }
                }
              }
            }
          GH_AW_VALIDATION_JSON: |
            {
              "create_pull_request_review_comment": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "line": {
                    "required": true,
                    "positiveInteger": true
                  },
                  "path": {
                    "required": true,
                    "type": "string"
                  },
                  "pull_request_number": {
                    "optionalPositiveInteger": true
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "side": {
                    "type": "string",
                    "enum": [
                      "LEFT",
                      "RIGHT"
                    ]
                  },
                  "start_line": {
                    "optionalPositiveInteger": true
                  }
                },
                "customValidation": "startLineLessOrEqualLine"
              },
              "noop": {
                "defaultMax": 2,
                "fields": {
                  "message": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  }
                }
              },
              "report_incomplete": {
                "defaultMax": 5,
                "fields": {
                  "details": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "reason": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 1024
                  }
                }
              },
              "report_missing_data": {
                "defaultMax": 20,
                "fields": {
                  "alternatives": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "context": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "data_type": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 128
                  },
                  "reason": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  }
                }
              },
              "report_missing_tool": {
                "defaultMax": 20,
                "fields": {
                  "alternatives": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 512
                  },
                  "reason": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "tool": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 128
                  }
                }
              },
              "submit_pull_request_review": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "event": {
                    "type": "string",
                    "enum": [
                      "APPROVE",
                      "REQUEST_CHANGES",
                      "COMMENT"
                    ]
                  },
                  "pull_request_number": {
                    "issueOrPRNumber": true
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  }
                }
              }
            }
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'generate_safe_outputs_tools.cjs'));
            await main();
      - name: Start MCP Gateway
        id: start-mcp-gateway
        env:
          DEBUG: ${{ env.DEBUG || runner.debug == '1' && '*' || '' }}
          GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
