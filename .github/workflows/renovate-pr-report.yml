name: Renovate PR report

# Reports on open Renovate PRs in a small initial set of repositories. Each report lands
# on that repository's dependency dashboard issue. Expand the matrix after the workflow
# has been validated manually; each matrix job mints its own repository-scoped App token.

on:
  workflow_dispatch:
    inputs:
      max-age-days:
        description: 'Only report PRs created within this many days.'
        required: false
        type: number
        default: 10
      model:
        description: 'Claude model used to analyze dependency release notes.'
        required: false
        type: string
        default: 'claude-haiku-4-5-20251001'
  # @TODO: Enable scheduling after the workflow is merged, so it can be tested manually first.
  # schedule:
  #   - cron: '0 8 * * 1,4' # Monday and Thursday, 08:00 UTC

permissions: {}

concurrency:
  group: renovate-pr-report
  cancel-in-progress: false

jobs:
  # One job per repo, so a repo the App cannot fully read fails only its own report.
  report:
    runs-on: ubuntu-latest
    environment: renovate
    permissions:
      contents: read
      id-token: write # mint the OIDC token exchanged for a Claude token
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repository:
          - mui/mui-public
          - mui/base-ui
    steps:
      - name: Generate a token scoped to ${{ matrix.repository }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.repository }}
      # The action lives in this repo, so it has to be on disk before `uses:` can
      # resolve it. Only the action itself is needed.
      - name: Check out the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/renovate-pr-report
          persist-credentials: false
      - name: Report on ${{ matrix.repository }}
        uses: ./.github/actions/renovate-pr-report
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ matrix.repository }}
          max-age-days: ${{ inputs.max-age-days || 10 }}
          model: ${{ inputs.model || 'claude-haiku-4-5-20251001' }}
          comment-author: ${{ steps.app-token.outputs.app-slug }}[bot]
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
