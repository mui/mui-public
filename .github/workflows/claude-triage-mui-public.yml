name: Issue triage

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Call the reusable workflow with this repository's configuration.
  triage:
    # Maximum grant; Claude jobs narrow to read-only GitHub access and id-token: write.
    permissions:
      contents: write # Publisher pushes the validated fix branch.
      pull-requests: write # Publisher creates or updates the draft fix PR.
      issues: write # Post issue reactions/comments and apply issue/PR labels.
      id-token: write # Claude jobs authenticate to Anthropic through OIDC federation.
    uses: ./.github/workflows/claude-triage.yml
    with:
      # Repository-specific configuration passed to the reusable workflow.
      debug: false # Set to true to log full Claude output, including tool results.
      node-version: 22.23.3
      setup-command: |
        pnpm install --frozen-lockfile
        pnpm release:build
