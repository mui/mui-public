name: Auditor shepherd

# Runs the reusable auditor shepherd against this repo hourly, or by hand. The setup it needs is in
# the README's "Agentic workflows" section.

on:
  schedule:
    - cron: '23 * * * *' # hourly
  workflow_dispatch:

permissions: {}

jobs:
  auditor-shepherd:
    # Maximum grant required by the reusable workflow; its agent job only gets read access.
    permissions:
      actions: read
      checks: read
      contents: write # push fixes to the auditor branches
      id-token: write # Anthropic WIF
      issues: write # failure reports
      pull-requests: write # mark ready, request reviews, update descriptions
      statuses: read
    uses: ./.github/workflows/auditor-shepherd-workflow.lock.yml
    with:
      reviewer_team: infra
    # Reusable workflows only get secrets the caller passes. These resolve to the code-infra-auditor
    # environment's secrets, because the jobs that use them run in that environment.
    secrets:
      CODE_INFRA_AUDITOR_CLIENT_ID: ${{ secrets.CODE_INFRA_AUDITOR_CLIENT_ID }}
      CODE_INFRA_AUDITOR_PRIVATE_KEY: ${{ secrets.CODE_INFRA_AUDITOR_PRIVATE_KEY }}
