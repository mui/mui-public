name: Check release branch freshness

on:
  workflow_call:
    inputs:
      base-branch:
        description: Branch that release PRs must contain.
        type: string
        default: master
      release-label:
        description: Label identifying release PRs.
        type: string
        default: release

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Every run reconciles all open PRs, including ones whose pending job GitHub
    # replaced. All event types share one writer for this repository.
    concurrency:
      group: release-up-to-date-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mui/mui-public
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          RELEASE_LABEL: ${{ inputs.release-label }}
        with:
          retries: 3
          script: |
            const { checkReleaseUpToDate } = require('./.github/workflows/scripts/prs/checkReleaseUpToDate.js');
            await checkReleaseUpToDate({ github, context, baseBranch: process.env.BASE_BRANCH, releaseLabel: process.env.RELEASE_LABEL });
