name: Monitor Renovate pull requests

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  monitor:
    uses: ./.github/workflows/reusable-renovate-pr-monitor.yml
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    with:
      dependency-dashboard-issue: 1516
      prompt: Analyze all open Renovate pull requests in this repository and return the merge-readiness report. The PRs are authored by code-infra-renovate[bot].
