# Weekly CircleCI flake triage that runs Claude with full autonomy inside a sandbox, then
# publishes its work through a separate, credential-holding job the agent cannot reach.
#
# THE MODEL, in one sentence: nothing secret ever enters the sandbox. The agent runs
# `--dangerously-skip-permissions` in a container with no credentials — a sidecar on the same
# docker network holds the Anthropic token and injects it, the CircleCI token is spent before the
# container starts, and the GitHub write token lives only in a downstream `publish` job. The agent
# emits a patch; `publish` inspects it and applies it to a fresh checkout it trusts. So a fully
# compromised agent can waste model spend and propose a bad diff to a draft PR — nothing more.
#
# THE PAYLOAD (fetch.mjs, proxy.mjs, bootstrap.sh, inspect-patch.mjs, prompt.txt) is inlined below
# as base64 so a caller pinning this file by SHA gets the exact code that will run — no second
# checkout at a moving ref. The blobs are GENERATED from .github/sandbox/*: edit there, run
# `node .github/sandbox/generate.mjs`, and a CI check enforces that they match. Do not hand-edit
# the blobs.
#
# CALLER SETUP (for `workflow_call` from another repo), and its two traps:
#   1. Set repo/org variables ANTHROPIC_FEDERATION_RULE_ID / _ORGANIZATION_ID / _SERVICE_ACCOUNT_ID
#      / _WORKSPACE_ID. `vars` resolves in the caller's repo, and the Anthropic federation rule
#      must accept the caller's OIDC subject. Get that subject right: a repo created, renamed, or
#      transferred after 2026-07-15 presents an immutable subject with numeric IDs
#      (`repo:owner@123/name@456:*`); a rule written `repo:owner/name:*` never matches. Read the
#      real value: `gh api repos/OWNER/REPO/actions/oidc/customization/sub --jq .sub_claim_prefix`.
#      A wrong subject fails inside the sidecar with a plain HTTP error in its container log.
#   2. Allow Actions to create pull requests (Settings → Actions → General). Without it the run
#      does all its work and fails on the final `gh pr create`.
#
# GitHub-hosted runners only: the network isolation assumes an ephemeral runner whose only
# credential-bearing neighbour is the metadata endpoint. A self-hosted runner breaks that and the
# job refuses to start.

name: Claude CI flake fix

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      report-only:
        description: Classify and report, but never open a PR.
        type: boolean
        default: false
      days:
        description: Window to analyse, in days.
        type: number
        default: 7
      branch:
        description: Branch to triage. Defaults to the repository's default branch.
        type: string
  workflow_call:
    inputs:
      report-only:
        type: boolean
        default: false
      days:
        type: number
        default: 7
      branch:
        type: string
        required: false
      circleci-org:
        description: CircleCI org to triage, if not this repo's owner.
        type: string
        required: false
      circleci-repo:
        description: CircleCI project to triage, if not this repo.
        type: string
        required: false
    secrets:
      circleci-token:
        description: CircleCI API token. Only needed for a private CircleCI project.
        required: false

permissions: {}

env:
  MODEL: claude-sonnet-5
  CLAUDE_CLI_VERSION: 2.1.247

jobs:
  agent:
    # A fork that enables Actions should not start triaging on the cron.
    if: ${{ github.event_name != 'schedule' || github.repository_owner == 'mui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # the ONLY permission — the sidecar mints the WIF token; no write scope here
    outputs:
      classify: ${{ steps.fetch.outputs.classify }}
    steps:
      - name: Refuse to run on a self-hosted runner
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          echo "::error::This workflow's isolation assumes an ephemeral GitHub-hosted runner."
          exit 1

      - name: Check out the repo under triage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.branch || github.event.repository.default_branch }}
          persist-credentials: false # no git credential in the tree the agent edits
          path: work

      - name: Materialize the sandbox payload (generated — see .github/sandbox/)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandbox"
          base64 -d <<< '' > "$RUNNER_TEMP/sandbox/fetch.mjs"
          base64 -d <<< '' > "$RUNNER_TEMP/sandbox/proxy.mjs"
          base64 -d <<< '' > "$RUNNER_TEMP/sandbox/bootstrap.sh"
          base64 -d <<< '' > "$RUNNER_TEMP/sandbox/prompt.txt"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Fetch CircleCI failures
        id: fetch
        env:
          # Spent here, on this trusted step, before any container starts — never in the sandbox.
          CIRCLECI_TOKEN: ${{ secrets.circleci-token || secrets.CIRCLECI_TOKEN }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/sandbox/fetch.mjs" \
            --org "${{ inputs.circleci-org || github.repository_owner }}" \
            --repo "${{ inputs.circleci-repo || github.event.repository.name }}" \
            --branch "${{ inputs.branch || github.event.repository.default_branch }}" \
            --days "${{ inputs.days || 7 }}" \
            --out "$RUNNER_TEMP/data" \
            --token "$CIRCLECI_TOKEN"

      - name: Render the agent prompt
        if: ${{ steps.fetch.outputs.classify == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/sandbox/prompt.txt" "$RUNNER_TEMP/out/prompt.txt"
          if [ "${{ inputs.report-only || false }}" = "true" ]; then
            printf '\n\nTHIS IS A REPORT-ONLY RUN: do Step 1 and stop. Write /out/report.md and change no files under /work.\n' >> "$RUNNER_TEMP/out/prompt.txt"
          fi

      - name: Isolate the sandbox network
        if: ${{ steps.fetch.outputs.classify == 'true' }}
        run: |
          set -euo pipefail
          # A normal bridge network (egress open, so the agent can install deps and run tests) with
          # the sidecar as a peer. Egress is acceptable because nothing in the box is secret — the
          # repo and its CI logs are public. The one thing worth blocking is the runner's metadata
          # endpoint, the classic credential-bearing neighbour. (Fuller host isolation is a known
          # gap, acceptable while callers are public repos; revisit for a private caller.)
          docker network create agent-net
          sudo iptables -I DOCKER-USER -d 169.254.0.0/16 -j DROP

      - name: Start the credential sidecar
        if: ${{ steps.fetch.outputs.classify == 'true' }}
        run: |
          set -euo pipefail
          # ACTIONS_ID_TOKEN_REQUEST_* are in the job env (id-token: write) and pass through here.
          # They plus the ANTHROPIC_* vars are all the sidecar needs to mint and exchange; the agent
          # container below gets none of them. TODO: pin node:22-alpine by digest.
          docker run -d --name sidecar \
            --network agent-net \
            --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ANTHROPIC_FEDERATION_RULE_ID='${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}' \
            -e ANTHROPIC_ORGANIZATION_ID='${{ vars.ANTHROPIC_ORGANIZATION_ID }}' \
            -e ANTHROPIC_SERVICE_ACCOUNT_ID='${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}' \
            -e ANTHROPIC_WORKSPACE_ID='${{ vars.ANTHROPIC_WORKSPACE_ID }}' \
            -v "$RUNNER_TEMP/sandbox/proxy.mjs:/app/proxy.mjs:ro" \
            node:22-alpine node /app/proxy.mjs
          sleep 5

      - name: Run the unrestricted agent
        if: ${{ steps.fetch.outputs.classify == 'true' }}
        run: |
          set -euo pipefail
          # No secret env crosses this boundary: the agent gets a URL to the sidecar and a tree.
          # ANTHROPIC_API_KEY is a placeholder — the CLI sends it, the sidecar strips and replaces it.
          # TODO: pin node:22-bookworm by digest.
          docker run --rm --name agent \
            --network agent-net \
            --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 512 --memory 8g --cpus 4 \
            -e ANTHROPIC_BASE_URL=http://sidecar:8080 \
            -e ANTHROPIC_API_KEY=placeholder-not-used \
            -e MODEL="$MODEL" -e CLAUDE_CLI_VERSION="$CLAUDE_CLI_VERSION" \
            -v "$GITHUB_WORKSPACE/work:/work" \
            -v "$RUNNER_TEMP/data:/data:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            -v "$RUNNER_TEMP/sandbox/bootstrap.sh:/app/bootstrap.sh:ro" \
            -w /work \
            node:22-bookworm bash /app/bootstrap.sh

      - name: Stop the sidecar
        if: ${{ always() }}
        run: docker rm -f sidecar 2>/dev/null || true

      - name: Collect outputs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # summary.txt always exists (the fetcher writes it); carry it alongside the agent output
          # so the publish job can post something to the tracking issue even on a quiet week.
          cp "$RUNNER_TEMP/data/summary.txt" "$RUNNER_TEMP/out/summary.txt" 2>/dev/null || true

      - name: Upload the agent output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-output
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: agent
    # Runs even when the agent step errored (a late API failure still leaves a report worth
    # posting), but not when the whole agent job failed to produce an artifact.
    if: ${{ !cancelled() && needs.agent.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fix branch
      pull-requests: write # open the draft PR
      issues: write # rolling tracking issue + labels
    steps:
      - name: Download the agent output
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: agent-output
          path: agent-output

      - name: Check out for patch application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.branch || github.event.repository.default_branch }}
          path: repo

      - name: Materialize the patch guard (generated — see .github/sandbox/)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandbox"
          base64 -d <<< '' > "$RUNNER_TEMP/sandbox/inspect-patch.mjs"

      - name: Inspect and apply the patch
        id: patch
        if: ${{ inputs.report-only != true }}
        run: |
          set -euo pipefail
          patch="$PWD/agent-output/fix.patch"
          if [ ! -s "$patch" ] || [ ! -s "$PWD/agent-output/pr-body.md" ]; then
            echo "no fix proposed"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The trust boundary: the patch is from the unrestricted agent, this job holds the write
          # token. Inspect, then dry-run, then apply — never run anything from the patch.
          node "$RUNNER_TEMP/sandbox/inspect-patch.mjs" "$patch" "$PWD/repo"
          git -C repo apply --check "$patch"
          git -C repo apply "$patch"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Open the draft PR
        id: pr
        if: ${{ steps.patch.outputs.applied == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          gh label create ci-flake-fix --force >/dev/null 2>&1 || true
          branch="ci-flake-fix/$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "$(cat ../agent-output/pr-title.txt)"
          git push -u origin "$branch"
          {
            cat ../agent-output/pr-body.md
            printf '\n\n---\n_Opened by a sandboxed agent. Unverified beyond any local check noted above; CI on this PR is the real test._\n'
          } > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --draft --label ci-flake-fix --title "$(cat ../agent-output/pr-title.txt)" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upsert the tracking issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          cd repo
          gh label create ci-flake-watch --force >/dev/null 2>&1 || true
          body_src="../agent-output/report.md"
          [ -s "$body_src" ] || body_src="../agent-output/summary.txt"
          body="$(cat "$body_src" 2>/dev/null || echo 'No CircleCI data this week.')"
          if [ -n "${PR_URL:-}" ]; then
            body="${body}"$'\n\n'"· suggested fix: ${PR_URL}"
          fi
          issue=$(gh issue list --label ci-flake-watch --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --label ci-flake-watch --title "CI flakiness watch" --body "$body"
          fi
