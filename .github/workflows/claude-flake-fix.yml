name: Claude CI flake fix

# Runs the reusable flake-fix workflow against this repo's CircleCI, the same way other repos call it.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Write nothing to GitHub; show the PR and issue comment it would post in the run summary.
        type: boolean
        default: false
      window:
        description: How far back to look (a CircleCI Insights window).
        type: choice
        options:
          - last-7-days
          - last-24-hours
          - last-30-days
          - last-60-days
          - last-90-days
        default: last-7-days
      branch:
        description: Branch to triage. Defaults to the repository's default branch.
        type: string
      circleci-branch:
        description: Branch to query on CircleCI, if different from the checked-out branch.
        type: string
      debug:
        description: Print the agent's full output to the run log (verbose; for debugging).
        type: boolean
        default: false
      model:
        description: Optional model override; leave blank to use the reusable workflow's default.
        type: string

permissions: {}

jobs:
  flake-fix:
    permissions:
      actions: read # read this run's referenced_workflows (resolve-ref job)
      id-token: write # Anthropic WIF (triage job)
      contents: write # push the fix branch (publish job)
      pull-requests: write # open the draft PR (publish job)
      issues: write # tracking issue report (publish job)
    uses: ./.github/workflows/claude-flake-fix-workflow.yml
    with:
      dry-run: ${{ inputs.dry-run || false }}
      window: ${{ inputs.window }}
      branch: ${{ inputs.branch }}
      circleci-branch: ${{ inputs.circleci-branch }}
      debug: ${{ inputs.debug || false }}
      model: ${{ inputs.model }} # blank falls through to the reusable workflow's default
      circleci-token-environment: flake-fix # master-gated environment holding CIRCLECI_TOKEN
    secrets:
      # The caller must pass the secret across the boundary. It resolves to the environment's
      # CIRCLECI_TOKEN because the fetch job declares that environment.
      circleci-token: ${{ secrets.CIRCLECI_TOKEN }}
