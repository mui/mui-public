extends: substitution
message: Use '%s' instead of '%s'
link: https://developers.google.com/style/abbreviations
ignorecase: false
level: error
nonword: true
action:
  name: replace
# Wider than upstream Google.Latin: also catches e.g/eg./i.e/ie. and any trailing
# punctuation, so no separate rule asks for "e.g." (which this one forbids).
# The lookbehind skips matches after a dot or inside a word (example.eg).
swap:
  '(?<![\w.])e\.?g\.?(?=[^\w.]|$)': for example
  '(?<![\w.])i\.?e\.?(?=[^\w.]|$)': that is
