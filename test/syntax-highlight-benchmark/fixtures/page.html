<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docs Infra demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      :root {
        --accent: #0070f3;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .card[data-state='open'] > .title::after {
        content: '\2193';
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <!-- Main content -->
    <main id="root" class="container">
      <section class="card" data-state="open">
        <h1 class="title">Hello &amp; welcome</h1>
        <p>
          Read the <a href="https://mui.com/docs" target="_blank" rel="noopener">documentation</a>.
        </p>
        <button type="button" disabled aria-label="Copy">Copy</button>
        <input type="text" name="query" placeholder="Search…" required />
      </section>
    </main>
    <script type="module">
      import { createRoot } from 'https://esm.sh/react-dom@19/client';

      const button = document.querySelector('button');
      button?.addEventListener('click', async (event) => {
        event.preventDefault();
        await navigator.clipboard.writeText(`copied at ${Date.now()}`);
      });
      createRoot(document.getElementById('root')).render(null);
    </script>
  </body>
</html>
