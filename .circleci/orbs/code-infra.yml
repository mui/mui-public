version: 2.1

commands:
  install-pnpm:
    description: 'Installs the pnpm version pinned in package.json#packageManager'
    steps:
      - run:
          name: Install pnpm package manager
          # cimg/node ships an unpinned `npm install -g pnpm`, and npm puts it next to the node binary.
          # That directory is the one `npm-run-path` probes before PATH, so tools that spawn `pnpm` that
          # way — publint packing through tinyexec — reach it rather than the version pinned here. Remove
          # it and install the pinned version.
          command: |
            sudo=''
            [ "$(id -u)" = '0' ] || sudo='sudo'
            # Cleared before installing rather than after: npm's global prefix is normally the directory
            # holding the node binary, so the install below puts the pinned version back here. Where the
            # prefix differs, this still removes the copy that would shadow it.
            node_bin_dir=$(dirname "$(command -v node)")
            $sudo rm -f "$node_bin_dir/pnpm" "$node_bin_dir/pnpx"

            # Installing the pinned version keeps pnpm from forking a second pnpm on every invocation
            # to switch to the one `packageManager` names.
            version=$(node -e '
              const { packageManager = "" } = require("./package.json");
              const [, pinned] = /^pnpm@([^+]+)/.exec(packageManager) || [];
              if (!pinned) {
                console.error(`Expected package.json#packageManager to name pnpm, got "${packageManager}"`);
                process.exit(1);
              }
              console.log(pinned);
            ')
            $sudo npm install -g "pnpm@$version"
      - run:
          name: View install environment
          command: |
            node --version
            command -v pnpm
            pnpm --version
  install-deps:
    description: 'Installs JavaScript dependencies using pnpm'
    parameters:
      package-overrides:
        description: 'A space separated list of package@version to override during installation'
        type: string
        default: ''
      react-version:
        description: 'React version to override with. `stable` keeps the lockfile version.'
        type: string
        default: stable
      typescript-version:
        description: 'TypeScript version to override with. `stable` keeps the lockfile version.'
        type: string
        default: stable
      playwright-version:
        description: 'Playwright version to override with (both `playwright` and `@playwright/test`). `stable` keeps the lockfile version.'
        type: string
        default: stable
      ignore-workspace:
        description: 'Set to true to ignore the pnpm workspace (useful for single-package repositories)'
        type: boolean
        default: false
    steps:
      - install-pnpm
      - when:
          condition: << parameters.ignore-workspace >>
          steps:
            - run:
                name: Initialize single-package repository
                command: pnpm install --ignore-workspace
      - when:
          condition:
            not: << parameters.ignore-workspace >>
          steps:
            - run:
                name: Install js dependencies
                command: |
                  # Named version parameters are appended to the free-form list. `@stable`
                  # entries are filtered out below, so unset ones cost nothing.
                  packages="<< parameters.package-overrides >> react@<< parameters.react-version >> typescript@<< parameters.typescript-version >> playwright@<< parameters.playwright-version >> @playwright/test@<< parameters.playwright-version >>"

                  IFS=' '
                  set -- $packages
                  pkg_array=("$@")
                  unset IFS

                  filtered=""
                  for pkg in "${pkg_array[@]}"; do
                    if [[ ! "$pkg" =~ @stable$ ]]; then
                      if [[ "$pkg" == *"@"* ]]; then
                        filtered="$filtered $pkg"
                      fi
                    fi
                  done

                  args="${filtered# }"
                  # Install from the repository lockfile before running code-infra.
                  # Using the installed binary avoids a separate `pnpm dlx`
                  # dependency graph that can diverge from the trusted lockfile.
                  pnpm install

                  if [ -n "$args" ]; then
                    pnpm code-infra set-version-overrides --pkg $args
                  fi
  eslint:
    description: 'Runs ESLint on the codebase'
    steps:
      - restore_cache:
          keys:
            - eslint-cache-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: ESLint
          command: pnpm run eslint:ci --cache --cache-strategy content
          # In large repos, ESLint without a warm cache can take a while before producing any output.
          # The default 10m no_output_timeout can be exceeded in that case.
          no_output_timeout: 15m
      - save_cache:
          key: eslint-cache-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .eslintcache

  stylelint:
    description: 'Runs Stylelint on the codebase'
    steps:
      - run:
          name: Stylelint
          command: pnpm stylelint

  valelint:
    description: 'Runs Vale linter on the codebase'
    steps:
      - run:
          name: Extract Vale version
          command: node -p "(require('./package.json').config && require('./package.json').config.valeVersion) || ''" > .vale-version
      - restore_cache:
          keys:
            - mui-vale-{{ checksum ".vale-version" }}
      - run:
          name: Lint writing style
          command: pnpm valelint
      - save_cache:
          paths:
            - node_modules/.cache/mui-vale
          key: mui-vale-{{ checksum ".vale-version" }}

  upload-coverage:
    description: 'Uploads code coverage to Codecov'
    parameters:
      key:
        type: string
        default: 'jsdom'
        description: 'The Codecov upload key suffix.'
    steps:
      - run:
          name: Check if coverage report is generated
          command: |
            if ! [[ -s coverage/lcov.info ]]
            then
              exit 1
            fi
      - run:
          name: Upload coverage report to Codecov
          command: |
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov -t ${CODECOV_TOKEN} -Z -F "<< parameters.key >>"

  pnpm-dedupe:
    description: 'Runs pnpm dedupe to optimize dependencies'
    steps:
      - run:
          name: '`pnpm dedupe` was run?'
          command: |
            # `pnpm dedupe --check` exceeds the cgroup-derived heap limit on medium executors.
            # A job-level NODE_OPTIONS wins over this default.
            export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=3584}"
            # #default-branch-switch
            if [[ $(git diff --name-status "${BASE_BRANCH:-master}" | grep -E 'pnpm-workspace\.yaml|pnpm-lock.yaml|package\.json') == "" ]];
            then
                echo "No changes to dependencies detected. Skipping..."
            else
                pnpm dedupe --check
            fi

  prettier:
    description: 'Checks code formatting using Prettier'
    steps:
      - run:
          name: '`pnpm prettier` changes committed?'
          command: |
            # #default-branch-switch
            if [[ $(git diff --name-status "${BASE_BRANCH:-master}" | grep pnpm-lock) == "" ]];
            then
                pnpm prettier --check
            else
                pnpm exec prettier --check . --ignore-path .lintignore
            fi

  run-linters:
    description: 'Runs all code linters'
    steps:
      - eslint
      - stylelint
      - valelint

  check-static-changes:
    description: 'Checks code changes after running static analysis tools'
    steps:
      - pnpm-dedupe
      - prettier

  check-generated:
    description: 'Runs a generator and fails if its output is not committed'
    parameters:
      command:
        description: 'Command that regenerates the files'
        type: string
      label:
        description: 'Step label. Defaults to the command. (`name` is reserved by CircleCI.)'
        type: string
        default: ''
      pathspec:
        description: 'Git pathspec limiting which files are checked, e.g. `docs/src` or `. :(exclude)pnpm-*.yaml`'
        type: string
        default: '.'
    steps:
      - when:
          condition: << parameters.label >>
          steps:
            - run:
                name: '`<< parameters.label >>` changes committed?'
                command: |
                  << parameters.command >>
                  git add -A -- << parameters.pathspec >> && git diff --exit-code --staged
      - unless:
          condition: << parameters.label >>
          steps:
            - run:
                name: '`<< parameters.command >>` changes committed?'
                command: |
                  << parameters.command >>
                  git add -A -- << parameters.pathspec >> && git diff --exit-code --staged

  extract-error-codes:
    description: 'Checks that `pnpm extract-error-codes` output is committed'
    steps:
      - check-generated:
          command: pnpm extract-error-codes

  build-with-compiler:
    description: 'Builds workspace packages with the React Compiler enabled'
    steps:
      - run:
          name: Add compiler package
          command: pnpm -F "./packages/*" add react-compiler-runtime
      - run:
          name: Build with compiler
          command: pnpm release:build --enableReactCompiler
          environment:
            MUI_REACT_COMPILER_MODE: 'infer'

  run-regressions:
    description: 'Runs visual regression tests and uploads screenshots to Argos'
    parameters:
      test-results-path:
        description: 'Directory passed to store_test_results. Empty string skips the step.'
        type: string
        default: test-results
    steps:
      - run:
          name: Run visual regression tests
          command: xvfb-run pnpm test:regressions
      - when:
          condition: << parameters.test-results-path >>
          steps:
            - store_test_results:
                path: << parameters.test-results-path >>
      - run:
          name: Upload screenshots to Argos CI
          command: pnpm test:argos

  test-types-next:
    description: 'Type-checks against typescript@next without failing the job'
    parameters:
      typescript-script:
        description: 'package.json script that runs the type check'
        type: string
        default: typescript
    steps:
      - install-deps:
          typescript-version: next
      - run:
          name: Tests TypeScript definitions (typescript@next)
          # Errors shift between nightlies; the run is monitored, not gating.
          command: |
            set +e
            pnpm << parameters.typescript-script >>
            exit 0

  upload-size-snapshot:
    description: 'Creates and uploads a size snapshot to S3'
    parameters:
      concurrency:
        description: 'Number of bundles measured in parallel. 0 keeps the script default.'
        type: integer
        default: 0
    steps:
      - run:
          name: create and upload a size snapshot
          command: |
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_ARTIFACTS
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_ARTIFACTS
            export AWS_REGION=$AWS_REGION_ARTIFACTS
            concurrency=<< parameters.concurrency >>
            if [ "$concurrency" -gt 0 ]; then
              pnpm size:snapshot --concurrency "$concurrency"
            else
              pnpm size:snapshot
            fi

executors:
  # Can be used as a single source of truth for Node version across all code-infra jobs on CI
  mui-node:
    parameters:
      node-version:
        type: string
        default: '22.23.2'
    docker:
      - image: cimg/node:<< parameters.node-version >>
    environment:
      IS_BROWSER_ENV: '0'

  mui-node-browser:
    parameters:
      playwright-img-version:
        type: string
        default: 'v1.62.1-noble'
    docker:
      - image: mcr.microsoft.com/playwright:<< parameters.playwright-img-version >>
    environment:
      IS_BROWSER_ENV: '1'
