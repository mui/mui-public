version: 2.1

commands:
  install-pnpm:
    description: 'Installs the pnpm version pinned in package.json#packageManager'
    steps:
      - run:
          name: Install pnpm package manager
          # cimg/node ships an unpinned `npm install -g pnpm`, and npm puts it next to the node binary.
          # That directory is the one `npm-run-path` probes before PATH, so tools that spawn `pnpm` that
          # way — publint packing through tinyexec — reach it rather than the version pinned here. Remove
          # it and install the pinned version, rather than shimming a third pnpm in front of both.
          command: |
            sudo=''
            if [ "$(id -u)" != '0' ]; then
              sudo='sudo'
            fi
            $sudo npm uninstall -g pnpm
            # npm's global prefix is not always the directory holding the node binary.
            node_bin_dir=$(dirname "$(command -v node)")
            $sudo rm -f "$node_bin_dir/pnpm" "$node_bin_dir/pnpx"

            # Pinning PNPM_VERSION lets pnpm skip its version switch instead of forking a second pnpm on
            # every invocation. Jobs running from a nested package.json without the field find no pin, and
            # fall back to letting pnpm switch itself.
            spec=$(node -p "require('./package.json').packageManager || ''" 2>/dev/null || true)
            version=''
            case "$spec" in
              pnpm@*)
                version=${spec#pnpm@}
                version=${version%%+*}
                ;;
            esac
            curl -fsSL https://get.pnpm.io/install.sh | env ${version:+PNPM_VERSION=$version} SHELL=/bin/bash sh -

            # Each CircleCI step is a non-login shell, which never reads the rc file `pnpm setup` wrote.
            echo 'export PNPM_HOME="$HOME/.pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME:$PATH"' >> "$BASH_ENV"
      - run:
          name: View install environment
          command: |
            node --version
            command -v pnpm
            pnpm --version
            # The invariant the step above exists to hold: nothing shadows the pinned pnpm from the
            # directory `npm-run-path` reaches before PATH.
            node_bin_dir=$(dirname "$(command -v node)")
            if [ -e "$node_bin_dir/pnpm" ]; then
              echo "A pnpm at $node_bin_dir/pnpm shadows the one this job installed" >&2
              exit 1
            fi

  install-deps:
    description: 'Installs JavaScript dependencies using pnpm'
    parameters:
      package-overrides:
        description: 'A space separated list of package@version to override during installation'
        type: string
        default: ''
      ignore-workspace:
        description: 'Set to true to ignore the pnpm workspace (useful for single-package repositories)'
        type: boolean
        default: false
    steps:
      - install-pnpm
      - when:
          condition: << parameters.ignore-workspace >>
          steps:
            - run:
                name: Initialize single-package repository
                command: pnpm install --ignore-workspace
      - when:
          condition:
            not: << parameters.ignore-workspace >>
          steps:
            - run:
                name: Install js dependencies
                command: |
                  packages="<< parameters.package-overrides >>"

                  if [[ -z "$packages" ]]; then
                    pnpm install
                    exit 0
                  fi

                  IFS=' '
                  set -- $packages
                  pkg_array=("$@")
                  unset IFS

                  filtered=""
                  for pkg in "${pkg_array[@]}"; do
                    if [[ ! "$pkg" =~ @stable$ ]]; then
                      if [[ "$pkg" == *"@"* ]]; then
                        filtered="$filtered $pkg"
                      fi
                    fi
                  done

                  args="${filtered# }"
                  # Install from the repository lockfile before running code-infra.
                  # Using the installed binary avoids a separate `pnpm dlx`
                  # dependency graph that can diverge from the trusted lockfile.
                  pnpm install

                  if [ -n "$args" ]; then
                    pnpm code-infra set-version-overrides --pkg $args
                  fi
  eslint:
    description: 'Runs ESLint on the codebase'
    steps:
      - restore_cache:
          keys:
            - eslint-cache-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: ESLint
          command: pnpm run eslint:ci --cache --cache-strategy content
          # In large repos, ESLint without a warm cache can take a while before producing any output.
          # The default 10m no_output_timeout can be exceeded in that case.
          no_output_timeout: 15m
      - save_cache:
          key: eslint-cache-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .eslintcache

  stylelint:
    description: 'Runs Stylelint on the codebase'
    steps:
      - run:
          name: Stylelint
          command: pnpm stylelint

  valelint:
    description: 'Runs Vale linter on the codebase'
    steps:
      - run:
          name: Extract Vale version
          command: node -p "(require('./package.json').config && require('./package.json').config.valeVersion) || ''" > .vale-version
      - restore_cache:
          keys:
            - mui-vale-{{ checksum ".vale-version" }}
      - run:
          name: Lint writing style
          command: pnpm valelint
      - save_cache:
          paths:
            - node_modules/.cache/mui-vale
          key: mui-vale-{{ checksum ".vale-version" }}

  upload-coverage:
    description: 'Uploads code coverage to Codecov'
    parameters:
      key:
        type: string
        default: 'jsdom'
        description: 'The Codecov upload key suffix.'
    steps:
      - run:
          name: Check if coverage report is generated
          command: |
            if ! [[ -s coverage/lcov.info ]]
            then
              exit 1
            fi
      - run:
          name: Upload coverage report to Codecov
          command: |
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov -t ${CODECOV_TOKEN} -Z -F "<< parameters.key >>"

  pnpm-dedupe:
    description: 'Runs pnpm dedupe to optimize dependencies'
    steps:
      - run:
          name: '`pnpm dedupe` was run?'
          command: |
            # #default-branch-switch
            if [[ $(git diff --name-status "${BASE_BRANCH:-master}" | grep -E 'pnpm-workspace\.yaml|pnpm-lock.yaml|package\.json') == "" ]];
            then
                echo "No changes to dependencies detected. Skipping..."
            else
                pnpm dedupe --check
            fi

  prettier:
    description: 'Checks code formatting using Prettier'
    steps:
      - run:
          name: '`pnpm prettier` changes committed?'
          command: |
            # #default-branch-switch
            if [[ $(git diff --name-status "${BASE_BRANCH:-master}" | grep pnpm-lock) == "" ]];
            then
                pnpm prettier --check
            else
                pnpm exec prettier --check . --ignore-path .lintignore
            fi

  run-linters:
    description: 'Runs all code linters'
    steps:
      - eslint
      - stylelint
      - valelint

  check-static-changes:
    description: 'Checks code changes after running static analysis tools'
    steps:
      - pnpm-dedupe
      - prettier

  upload-size-snapshot:
    description: 'Creates and uploads a size snapshot to S3'
    steps:
      - run:
          name: create and upload a size snapshot
          command: |
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_ARTIFACTS
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_ARTIFACTS
            export AWS_REGION=$AWS_REGION_ARTIFACTS
            pnpm size:snapshot

executors:
  # Can be used as a single source of truth for Node version across all code-infra jobs on CI
  mui-node:
    parameters:
      node-version:
        type: string
        default: '22.23.2'
    docker:
      - image: cimg/node:<< parameters.node-version >>
    environment:
      IS_BROWSER_ENV: '0'

  mui-node-browser:
    parameters:
      playwright-img-version:
        type: string
        default: 'v1.56.1-noble'
    docker:
      - image: mcr.microsoft.com/playwright:<< parameters.playwright-img-version >>
    environment:
      IS_BROWSER_ENV: '1'
