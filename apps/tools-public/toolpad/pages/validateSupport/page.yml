# yaml-language-server: $schema=https://raw.githubusercontent.com/mui/toolpad/v0.13.0/docs/schemas/v1/definitions.json#properties/Page

apiVersion: v1
kind: page
spec:
  title: Validate support
  display: standalone
  parameters:
    - name: issueId
      value: '9195'
    - name: repo
      value: mui-x
  content:
    - component: Text
      name: text
      layout:
        columnSize: 1
      props:
        mode: markdown
        value:
          $$jsExpression: |-
            `## Moved

            This page has moved: https://frontend-public.mui.com/validate-support?${new URLSearchParams({ repo: page.parameters.repo, issueId: page.parameters.issueId })}`
    - component: codeComponent.Redirect
      name: redirect
      props:
        url:
          $$jsExpression: |-
            `https://frontend-public.mui.com/validate-support?${new URLSearchParams({ repo: page.parameters.repo, issueId: page.parameters.issueId })}`
  alias:
    - jyhs86t
  displayName: Validate support
